<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly RSI Scanner</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#e5e7eb;--ac:#0f766e;--rd:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mu:#9aa0a6;--bd:#2a2e36;--ac:#2dd4bf;--rd:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:640px;margin:auto}
h1{font-size:18px;margin:4px 0}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select{flex:1;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card.done{opacity:.55}
.top{display:flex;justify-content:space-between;align-items:baseline}
.sym{font-weight:700;font-size:16px}.rsi{color:var(--ac);font-weight:600;font-size:13px}
.nm{color:var(--mu);font-size:12px;margin:2px 0 8px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}
.g div span{display:block;color:var(--mu);font-size:11px}
.sl{color:var(--rd)}
label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px}
</style></head><body>
<h1>Weekly RSI &gt; 60 Scanner</h1>
<div class="sub">Nifty 500 &middot; Week of 02 Nov 2026 &middot; Generated 07 Nov 2026 18:08 &middot; Risk &#8377;500/stock</div>
<div class="bar"><input id="q" placeholder="Search symbol / industry">
<select id="s"><option value="risk_pct">Tightest stop</option><option value="rsi">RSI high</option><option value="symbol">A-Z</option></select></div>
<div id="list"></div>
<script>
const D=[{"symbol": "IPCALAB", "name": "Ipca Laboratories Ltd.", "industry": "Healthcare", "week": "02 Nov 2026", "rsi": 60.3, "prev_rsi": 59.5, "entry": 1941.8, "stop": 1865.97, "risk_pct": 3.91, "qty": 6, "capital": 11651}, {"symbol": "RADICO", "name": "Radico Khaitan Ltd", "industry": "Fast Moving Consumer Goods", "week": "02 Nov 2026", "rsi": 60.5, "prev_rsi": 50.7, "entry": 4515.2, "stop": 4332.93, "risk_pct": 4.04, "qty": 2, "capital": 9030}, {"symbol": "RUBICON", "name": "Rubicon Research Ltd.", "industry": "Healthcare", "week": "02 Nov 2026", "rsi": 61.3, "prev_rsi": 59.3, "entry": 1659.3, "stop": 1585.6, "risk_pct": 4.44, "qty": 6, "capital": 9956}, {"symbol": "TITAN", "name": "Titan Company Ltd.", "industry": "Consumer Durables", "week": "02 Nov 2026", "rsi": 60.4, "prev_rsi": 46.4, "entry": 5000.0, "stop": 4728.48, "risk_pct": 5.43, "qty": 1, "capital": 5000}, {"symbol": "LALPATHLAB", "name": "Dr. Lal Path Labs Ltd.", "industry": "Healthcare", "week": "02 Nov 2026", "rsi": 63.6, "prev_rsi": 59.9, "entry": 1970.0, "stop": 1858.95, "risk_pct": 5.64, "qty": 4, "capital": 7880}, {"symbol": "NHPC", "name": "NHPC Ltd.", "industry": "Power", "week": "02 Nov 2026", "rsi": 60.1, "prev_rsi": 53.4, "entry": 82.08, "stop": 76.59, "risk_pct": 6.69, "qty": 91, "capital": 7469}, {"symbol": "INDIGO", "name": "InterGlobe Aviation Ltd.", "industry": "Services", "week": "02 Nov 2026", "rsi": 61.9, "prev_rsi": 49.1, "entry": 5476.0, "stop": 5083.72, "risk_pct": 7.16, "qty": 1, "capital": 5476}, {"symbol": "JSWSTEEL", "name": "JSW Steel Ltd.", "industry": "Metals & Mining", "week": "02 Nov 2026", "rsi": 61.3, "prev_rsi": 50.6, "entry": 1357.1, "stop": 1259.36, "risk_pct": 7.2, "qty": 5, "capital": 6785}, {"symbol": "GAIL", "name": "GAIL (India) Ltd.", "industry": "Oil Gas & Consumable Fuels", "week": "02 Nov 2026", "rsi": 64.7, "prev_rsi": 48.9, "entry": 185.79, "stop": 172.36, "risk_pct": 7.23, "qty": 37, "capital": 6874}, {"symbol": "ANTHEM", "name": "Anthem Biosciences Ltd.", "industry": "Healthcare", "week": "02 Nov 2026", "rsi": 62.3, "prev_rsi": 51.1, "entry": 915.55, "stop": 846.02, "risk_pct": 7.59, "qty": 7, "capital": 6409}, {"symbol": "MARICO", "name": "Marico Ltd.", "industry": "Fast Moving Consumer Goods", "week": "02 Nov 2026", "rsi": 66.4, "prev_rsi": 48.9, "entry": 897.75, "stop": 826.55, "risk_pct": 7.93, "qty": 7, "capital": 6284}, {"symbol": "ABDL", "name": "Allied Blenders and Distillers Ltd.", "industry": "Fast Moving Consumer Goods", "week": "02 Nov 2026", "rsi": 60.3, "prev_rsi": 59.3, "entry": 708.0, "stop": 650.52, "risk_pct": 8.12, "qty": 8, "capital": 5664}, {"symbol": "GROWW", "name": "Billionbrains Garage Ventures Ltd.", "industry": "Financial Services", "week": "02 Nov 2026", "rsi": 61.5, "prev_rsi": 52.2, "entry": 215.08, "stop": 196.26, "risk_pct": 8.75, "qty": 26, "capital": 5592}];let T={};try{T=JSON.parse(localStorage.getItem("wrs_taken")||"{}")}catch(e){}
const key=d=>d.symbol+"|"+d.week,f=n=>n.toLocaleString("en-IN");
function draw(){
 const q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("s").value;
 let r=D.filter(d=>(d.symbol+d.industry+d.name).toLowerCase().includes(q));
 r.sort((a,b)=>s=="symbol"?a.symbol.localeCompare(b.symbol):s=="rsi"?b.rsi-a.rsi:a.risk_pct-b.risk_pct);
 document.getElementById("list").innerHTML=r.length?r.map(d=>`
 <div class="card ${T[key(d)]?"done":""}">
  <div class="top"><span class="sym">${d.symbol}</span><span class="rsi">RSI ${d.prev_rsi} &rarr; ${d.rsi}</span></div>
  <div class="nm">${d.name} &middot; ${d.industry}</div>
  <div class="g"><div><span>Entry</span>&#8377;${f(d.entry)}</div>
  <div class="sl"><span>SL (W SMA20 close)</span>&#8377;${f(d.stop)}</div>
  <div><span>Risk/share</span>${d.risk_pct}%</div>
  <div><span>Qty</span><b>${f(d.qty)}</b></div>
  <div><span>Capital</span>&#8377;${f(d.capital)}</div>
  <div><span>Max loss</span>&#8377;500</div></div>
  <label><input type="checkbox" ${T[key(d)]?"checked":""} onchange="tg('${key(d)}',this.checked)"> Trade taken</label>
 </div>`).join(""):'<div class="empty">No stocks crossed weekly RSI 60 this week.</div>';
}
function tg(k,v){T[k]=v;try{localStorage.setItem("wrs_taken",JSON.stringify(T))}catch(e){}draw()}
document.getElementById("q").oninput=draw;document.getElementById("s").onchange=draw;draw();
</script></body></html>
